services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ncmrwf_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db}
    ports:
      - "5434:5432"   # Windows host 5434 -> Container Postgres 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-weather_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ncmrwf_redis
    restart: always
    ports:
      - "6380:6379"   # host 6380 -> container 6379 (avoids conflict with wtf-redis on 6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ncmrwf_api
    restart: always
    volumes:
      - .:/workspace
    ports:
      - "8001:8000"   # Windows host 8001 -> Container Uvicorn 8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ncmrwf_worker
    restart: always
    volumes:
      - .:/workspace
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: